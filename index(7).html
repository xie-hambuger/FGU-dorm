    /* ===== iOS 系統感字體 ===== */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",

font-family:

    /* ===== 頁面容器 ===== */
    .container {
      max-width: 420px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    /* ===== 標題 ===== */
    .title {

      font-weight: 600;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 15px;
      color: #6e6e73;

    }

    /* ===== 玻璃卡片 ===== */
    .card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      transition: transform 0.25s ease;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    /* ===== 卡片標題 ===== */
    .card h2 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 8px;
    }

    .card p {
      font-size: 14px;
      line-height: 1.6;
      margin: 0;
      color: #3a3a3c;
    }

    /* ===== 公告跑馬燈 ===== */
    .marquee {
      overflow: hidden;
      white-space: nowrap;
    }

    .marquee span {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 12s linear infinite;
      font-weight: 500;
      color: #007AFF;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    /* ===== 底部 ===== */
    .footer {
      text-align: center;
      font-size: 12px;
      color: #8e8e93;
      margin-top: 32px;
    }
  </style>
</head>
